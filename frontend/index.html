<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BreatheSafe AI</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="dark">

<!-- ================= HEADER ================= -->
<header>
  <div class="header-left">
    <img src="logo.png" class="logo" alt="BreatheSafe logo">
    <span class="title">BreatheSafe AI</span>
  </div>

  <div class="header-right">
    <select onchange="changeCountry(this.value)">
      <option value="US">AQI – US</option>
      <option value="IN">AQI – India</option>
      <option value="CN">AQI – China</option>
      <option value="GLOBAL">Global</option>
    </select>

    <button onclick="toggleTheme()">🌗</button>
  </div>
</header>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="aqi-main">
      <span id="liveAQI">162</span>
      <span class="aqi-label">AQI (US)</span>
    </div>

    <div class="aqi-info">
      <h2 id="aqiStatus">Unhealthy</h2>
      <p id="aqiAdvice">
        Avoid prolonged outdoor exposure. Wear a mask if required.
      </p>

      <div class="aqi-bar">
        <div class="aqi-fill" id="aqiFill"></div>
      </div>
    </div>
  </div>
</section>

<!-- ================= MAIN ================= -->
<section class="main-layout">

  <!-- ===== AQI CHART ===== -->
  <div class="chart-panel">
    <h3>AQI Trend</h3>
    <canvas id="aqiChart"></canvas>
  </div>

  <!-- ===== ML MODELS ===== -->
  <div class="models-panel">

    <!-- LSTM -->
    <div class="ml-card">
      <h4>LSTM Forecast</h4>
      <textarea
  id="aqiInput"
  placeholder="Enter last 30 AQI values (comma separated)
Example: 162,164,165,167,169,170,...">
</textarea>

      <button onclick="predictAQI()">Predict</button>
      <div class="result" id="aqiResult"></div>
    </div>

    <!-- RF AQI -->
    <div class="ml-card">
      <h4>RF AQI Estimation</h4>
      <input
        id="rfInput"
        type="number"
        step="1"
        placeholder="Enter AQI value">
      <button onclick="runRFAQI()">Estimate</button>
      <div class="result" id="rfResult"></div>
    </div>

    <!-- SPIKE -->
    <div class="ml-card">
      <h4>Pollution Spike</h4>
      <input
        id="spikeInput"
        type="number"
        step="1"
        placeholder="Enter AQI value">
      <button onclick="detectSpike()">Check</button>
      <div class="result" id="spikeResult"></div>
    </div>

    <!-- HEALTH -->
    <div class="ml-card">
      <h4>Health Risk</h4>
      <input
        id="healthInput"
        type="number"
        step="1"
        placeholder="Enter AQI value">
      <button onclick="checkHealth()">Analyze</button>
      <div class="result" id="healthResult"></div>
    </div>

  </div>
</section>

<!-- ================= FOOTER ================= -->
<footer>
  Models: LSTM • Random Forest • Isolation Forest<br>
  Built using Google Colab & ML Stack
</footer>

<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
